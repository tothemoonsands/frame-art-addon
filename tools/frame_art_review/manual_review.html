<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame Art · Manual fixes</title>
<style>
:root{color-scheme:dark;font:14px/1.4 system-ui;--bg:#101414;--panel:#1b2222;--line:#364141;--accent:#c6ef9b;--muted:#afbbbb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f6f3;height:100dvh;display:flex;flex-direction:column}header{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;gap:20px;align-items:center}h1{font-size:18px;margin:0}a{color:var(--accent)}button,input,select,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}.primary{background:var(--accent);color:#172114;font-weight:650}.flag{background:#e7bd80;color:#251b10;font-weight:650}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);flex:1;min-height:0}aside{border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;padding:14px;min-height:0}#list{overflow:auto;flex:1}.album{width:100%;text-align:left;border-color:transparent;background:transparent;margin:2px 0}.album[aria-current=true]{background:#2d3b2b;border-color:var(--accent)}.album strong,.album small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.album small{color:var(--muted)}main{padding:12px 20px;display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}.heading{display:flex;justify-content:space-between;gap:12px;align-items:center}h2{font-size:21px;margin:0}#stage{flex:1;min-height:100px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#080b0b;border-radius:8px}.imagewrap{position:relative;max-width:100%;max-height:100%;line-height:0}#art{display:block;max-width:100%;max-height:100%;cursor:crosshair}.marker{position:absolute;width:26px;height:26px;border:3px solid #fff;border-radius:50%;background:#e4883eaa;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #151515;pointer-events:auto;cursor:pointer;color:white;font:bold 14px/20px system-ui;text-align:center;padding:0}#form{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,0.85fr);gap:14px}textarea{width:100%;height:64px;resize:none}#tags{display:flex;gap:5px;flex-wrap:wrap}.tag{padding:4px 7px;font-size:12px}.tag[aria-pressed=true]{border-color:#edc488;background:#443422}footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spacer{flex:1}#message{color:#edc488;min-height:20px}dialog{border:1px solid var(--line);background:var(--bg);width:96vw;height:94vh}dialog img{width:100%;height:calc(100% - 44px);object-fit:contain}progress{width:100%;height:5px;accent-color:var(--accent)}[hidden]{display:none!important}@media(max-width:850px){.layout{grid-template-columns:175px minmax(0,1fr)}#form{grid-template-columns:1fr}header{padding:8px}main{padding:8px}h2{font-size:17px}#tags{gap:3px}.tag{font-size:11px}}@media(max-height:700px){header{padding:6px 14px}main{gap:6px;padding:8px 14px}textarea{height:45px}.tag{padding:3px 5px}button{padding:6px 8px}}
</style></head><body>
<header><h1>Manual artwork review</h1><span id="counts" class="muted"></span><span class="spacer"></span><a href="/api/manual-review/export" download="manual-fix-queue.json">Export fix queue</a><a href="/">Library tools</a></header>
<div class="layout"><aside><input id="search" placeholder="Search artist / album" aria-label="Search albums"><select id="filter" aria-label="Review filter"><option value="unreviewed">To review</option><option value="flagged">Needs fix</option><option value="later">Later</option><option value="ok">Looks good</option><option value="all">All albums</option></select><progress id="progress" max="1" value="0"></progress><small id="listCount" class="muted"></small><div id="list"></div></aside>
<main><div class="heading"><div><h2 id="title">Loading library…</h2><div id="artist" class="muted"></div></div><button id="zoom">Full size</button></div>
<div id="stage"><div class="imagewrap" id="wrap"><img id="art" alt="Selected finished album artwork"><span id="markers"></span></div></div>
<div id="form"><div><label for="notes">What needs adjusting?</label><textarea id="notes" maxlength="5000" placeholder="1: align the canopy. 2: fix the pavement shadow."></textarea></div><div><div id="tags"></div><small class="muted">Click to add numbered markers. Click a marker to remove it.</small> <button id="clearMarker" class="tag">Clear all markers</button></div></div>
<footer><button id="back">← Previous</button><button id="good" class="primary">Looks good · A</button><button id="flag" class="flag">Needs fix · F</button><button id="later">Later · S</button><button id="next">Next →</button><span class="spacer"></span><button id="undo" disabled>Undo last save</button></footer>
<div id="message" role="status" aria-live="polite"></div><small class="muted">Decisions save and advance. Original cover stays untouched during repairs; each fix will be previewed before deployment.</small>
</main></div><dialog id="lightbox"><button id="closeZoom">Close · Esc</button><img id="large" alt="Full-resolution finished artwork"></dialog>
<script>
const $=id=>document.getElementById(id),labels={unreviewed:'To review',ok:'Looks good',flagged:'Needs fix',later:'Later'};
let data,current=null,busy=false,loaded=false,points=[],tags=[],undo=null,dirty=false;
let lastFilter='unreviewed',lastSearch='';
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem('manual-'+k))??f}catch{return f}},write=(k,v)=>localStorage.setItem('manual-'+k,JSON.stringify(v));
$('filter').value=read('filter','unreviewed');lastFilter=$('filter').value;
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json','X-Frame-Review':'1'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function visible(){const q=$('search').value.toLowerCase(),f=$('filter').value;return data.albums.filter(a=>(f==='all'||a.status===f)&&`${a.artist} ${a.title}`.toLowerCase().includes(q))}
function drawList(){const rows=visible();$('listCount').textContent=rows.length+' albums in this view';$('counts').textContent=`${data.total} albums · ${data.counts.ok} good · ${data.counts.flagged} need fixes · ${data.counts.unreviewed} unreviewed`;$('progress').max=data.total;$('progress').value=data.total-data.counts.unreviewed;$('list').replaceChildren();for(const a of rows){const b=document.createElement('button');b.className='album';b.setAttribute('aria-current',a.id===current);const title=document.createElement('strong'),sub=document.createElement('small');title.textContent=a.title;sub.textContent=`${a.artist} · ${labels[a.status]}`;b.append(title,sub);b.onclick=()=>navigate(a.id);$('list').append(b)}}
function fit(){if(!loaded)return;const box=$('stage'),im=$('art'),ratio=im.naturalWidth/im.naturalHeight;const w=Math.min(box.clientWidth,box.clientHeight*ratio);$('wrap').style.width=w+'px';$('wrap').style.height=(w/ratio)+'px';im.style.width='100%';im.style.height='100%'}
new ResizeObserver(fit).observe($('stage'));
function mark(){ $('markers').replaceChildren();points.forEach((p,i)=>{const m=document.createElement('button');m.className='marker';m.textContent=i+1;m.title='Remove marker '+(i+1);m.setAttribute('aria-label',m.title);m.style.left=(p[0]*100)+'%';m.style.top=(p[1]*100)+'%';m.onclick=e=>{e.stopPropagation();if(busy)return;points.splice(i,1);dirty=true;mark()};$('markers').append(m)})}
function drawTags(){ $('tags').replaceChildren();for(const name of data.reasons){const b=document.createElement('button');b.className='tag';b.textContent=name;b.setAttribute('aria-pressed',tags.includes(name));b.onclick=()=>{if(busy)return;tags=tags.includes(name)?tags.filter(x=>x!==name):[...tags,name];dirty=true;drawTags()};$('tags').append(b)}}
function controls(){for(const id of ['good','flag','later','next','back','zoom','clearMarker','notes'])$(id).disabled=busy||!current||(['good','flag'].includes(id)&&!loaded);$('undo').disabled=busy||!undo;}
function show(id){current=id;write('current',id);const a=data.albums.find(a=>a.id===id);dirty=false;loaded=false;$('art').hidden=true;$('message').textContent='';$('form').hidden=!a;$('stage').hidden=!a;if(!a){$('title').textContent='This view is clear';$('artist').textContent='Choose another filter to continue or revisit your decisions.';controls();drawList();return}tags=[...a.reasons];points=structuredClone(a.points);$('notes').value=a.notes;$('title').textContent=a.title;$('artist').textContent=`${a.artist} · ${labels[a.status]} · #${a.id}`;drawTags();mark();$('art').onload=()=>{loaded=true;$('art').hidden=false;fit();controls()};$('art').onerror=()=>{loaded=false;$('message').textContent='Artwork could not load. You can flag it Later and describe the issue.';controls()};$('art').src='/manual-art?id='+id+'&version='+encodeURIComponent(a.asset);controls();drawList()}
function navigate(id){if(busy)return;if(dirty&&!confirm('Discard the notes or marker you have not saved yet?'))return;show(id)}
function step(delta){const rows=visible(),i=rows.findIndex(a=>a.id===current);const a=rows[i+delta];if(a)navigate(a.id)}
async function refresh(){data=await api('/api/manual-review')}
async function save(status){if(busy||!current||(['ok','flagged'].includes(status)&&!loaded))return;const a=data.albums.find(a=>a.id===current),rows=visible(),i=rows.findIndex(a=>a.id===current),following=rows.slice(i+1).map(x=>x.id);const before=structuredClone(a);busy=true;controls();try{await api('/api/manual-review',{album_id:a.id,revision:a.revision,asset:a.asset,status,notes:$('notes').value,reasons:tags,points});undo=before;dirty=false;await refresh();const ids=new Set(visible().map(x=>x.id));show(following.find(id=>ids.has(id))??visible().find(x=>x.id!==a.id)?.id??null);$('message').textContent='Saved · '+labels[status]}catch(e){$('message').textContent=e.message}finally{busy=false;controls()}}
$('good').onclick=()=>save('ok');$('flag').onclick=()=>save('flagged');$('later').onclick=()=>save('later');$('back').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('notes').oninput=()=>dirty=true;
$('art').onclick=e=>{if(busy||!loaded)return;const r=e.target.getBoundingClientRect();if(points.length>=30){$('message').textContent='Up to 30 markers per image.';return}points.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]);dirty=true;mark()};$('clearMarker').onclick=()=>{points=[];dirty=true;mark()};
$('undo').onclick=async()=>{if(!undo||busy)return;const a=undo;if(dirty&&!confirm('Discard unsaved edits and undo the last saved decision?'))return;busy=true;controls();try{const currentReview=data.albums.find(x=>x.id===a.id);await api('/api/manual-review',{album_id:a.id,revision:currentReview.revision,asset:a.asset,status:a.status,notes:a.notes,reasons:a.reasons,points:a.points});undo=null;await refresh();$('filter').value='all';write('filter','all');show(a.id);$('message').textContent='Last decision undone'}catch(e){$('message').textContent=e.message}finally{busy=false;controls()}};
for(const id of ['filter','search'])$(id).oninput=()=>{if(busy)return;if(dirty&&!confirm('Discard unsaved edits and change the view?')){$('filter').value=lastFilter;$('search').value=lastSearch;return}lastFilter=$('filter').value;lastSearch=$('search').value;write('filter',$('filter').value);const rows=visible();show(rows.some(a=>a.id===current)?current:rows[0]?.id??null)};
$('zoom').onclick=()=>{$('large').src=$('art').src;$('lightbox').showModal()};$('closeZoom').onclick=()=>$('lightbox').close();
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||$('lightbox').open||['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName))return;const actions={a:()=>save('ok'),f:()=>save('flagged'),s:()=>save('later'),ArrowRight:()=>step(1),ArrowLeft:()=>step(-1)};if(actions[e.key]){e.preventDefault();actions[e.key]()}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
refresh().then(()=>{const id=read('current',null),rows=visible();show(rows.some(a=>a.id===id)?id:rows[0]?.id??null)}).catch(e=>$('message').textContent=e.message);
</script></body></html>
