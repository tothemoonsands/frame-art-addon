<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final 23 • Artwork selection</title><style>
*{box-sizing:border-box}body{margin:0;background:#101419;color:#edf0f4;font:15px system-ui}button,select{font:inherit;color:inherit;background:#252e39;border:1px solid #455261;border-radius:7px;padding:8px 12px;cursor:pointer}button:hover{background:#37495c}button:disabled{opacity:.45;cursor:wait}header{height:65px;display:flex;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid #35404d}header strong{font-size:19px}#progress{color:#aebecf}main{height:calc(100dvh - 65px);display:grid;grid-template-columns:245px 1fr}aside{overflow:auto;padding:12px;border-right:1px solid #35404d}aside button{display:block;width:100%;text-align:left;margin-bottom:7px;font-size:12px;line-height:1.4}aside .active{outline:2px solid #7eb4ff}aside .rejected{border-left:4px solid #edb158}aside .done{color:#9ce3b6}.work{min-height:0;display:flex;flex-direction:column;padding:18px;gap:12px}.heading{display:flex;align-items:center;gap:12px}h1{font-size:21px;margin:0}#badge{color:#ffca79;background:#46331f;padding:6px 10px;border-radius:7px;font-size:12px}#notes{color:#aebecf;font-size:13px;min-height:18px}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}.card{display:flex;flex-direction:column;min-height:0;border:2px solid #35404d;border-radius:10px;overflow:hidden;background:#181e26}.card.chosen{border-color:#78dba3}.label{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.imagebox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#090c10}.imagebox img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}.choose{margin:12px;background:#264b39;border-color:#4a8665}.card small{color:#aebecf}footer{display:flex;align-items:center;gap:10px}#status{flex:1;color:#a9d9ba;font-size:13px}.hint{font-size:12px;color:#98a9bb}dialog{width:96vw;height:94vh;border:1px solid #566777;background:#101419;padding:10px}dialog::backdrop{background:#000d}dialog img{width:100%;height:calc(100% - 40px);object-fit:contain}dialog button{float:right}@media(max-width:900px){main{grid-template-columns:160px 1fr}h1{font-size:16px}.work{padding:10px}.label{font-size:12px}.hint{display:none}}
</style></head><body><header><strong>Final artwork selection</strong><span id="progress"></span><span class="hint">Selections save locally • Deployment comes after review</span></header><main><aside><select id="filter"><option value="all">All 23 albums</option><option value="pending">Unselected</option><option value="rejected">Generation rejected</option></select><div id="list"></div></aside><section class="work"><div class="heading"><h1 id="title"></h1><span id="badge" hidden>Generation rejected</span></div><div id="notes"></div><div class="pairs"><div class="card" id="originalCard"><div class="label"><b>Pre-upgrade original</b><small id="originalMark"></small></div><div class="imagebox"><img id="original" alt="Pre-upgrade finished artwork"></div><button class="choose" data-choice="original">Use original · 1</button></div><div class="card" id="newCard"><div class="label"><b id="newLabel">Latest version</b><small id="newMark"></small></div><div class="imagebox"><img id="new" alt="Latest finished artwork"></div><button class="choose" data-choice="new">Use this version · 2</button></div></div><footer><button id="prev">← Previous</button><button id="next">Next →</button><button id="clear">Clear selection</button><span id="status"></span><span class="hint">1 / 2 chooses and advances • Click image to enlarge</span></footer></section></main><dialog id="zoom"><button id="closeZoom">Close · Esc</button><img id="zoomImage" alt="Full image"></dialog><script>
let s,index=0,busy=false;const $=id=>document.getElementById(id);let visible=()=>s.albums.filter(a=>$('filter').value==='all'||($('filter').value==='pending'?!s.choices[a.id]:a.rejected));
function render(){let a=s.albums[index],selected=s.choices[a.id]?.choice;localStorage.setItem('final23-id',a.id);$('progress').textContent=`${Object.keys(s.choices).length} / ${s.albums.length} selected`;$('title').textContent=`${a.number}. ${a.artist} — ${a.title}`;$('badge').hidden=!a.rejected;$('notes').textContent=a.rejected?'Repair generation was rejected. Compare the current upgraded image with the saved pre-upgrade original.':`Review note: ${a.notes}`;$('newLabel').textContent=a.new_label;
for(let side of ['original','new']){let img=$(side),url=`/image?id=${a.id}&side=${side}`;if(img.getAttribute('src')!==url)img.src=url;$(side+'Card').classList.toggle('chosen',selected===side);$(side+'Mark').textContent=selected===side?'✓ Selected':''}let list=$('list');list.replaceChildren();for(let item of visible()){let b=document.createElement('button');b.textContent=`${s.choices[item.id]?'✓ ':''}${item.number}. ${item.artist} — ${item.title}${item.rejected?' · Rejected':''}`;b.className=[item.id===a.id?'active':'',item.rejected?'rejected':'',s.choices[item.id]?'done':''].join(' ');b.onclick=()=>{if(!busy){index=s.albums.indexOf(item);render()}};list.append(b)} }
function move(delta){let v=visible(),pos=v.indexOf(s.albums[index]);if(v.length){index=s.albums.indexOf(v[(pos+delta+v.length)%v.length]);render()}}
async function select(choice){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{let r=await fetch('/api/select',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:s.albums[index].id,choice,revision:s.revision})});let d=await r.json();if(!r.ok)throw Error(d.error);Object.assign(s,d);if(choice){let next=s.albums.find((a,i)=>i>index&&!s.choices[a.id])||s.albums.find(a=>!s.choices[a.id]);if(next)index=s.albums.indexOf(next)}$('status').textContent=Object.keys(s.choices).length===s.albums.length?'All 23 selected. Ready to review selections and deploy.':'Saved';render()}catch(e){$('status').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>select(b.dataset.choice));$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('clear').onclick=()=>select(null);$('filter').onchange=()=>{let v=visible();if(v.length&&!v.includes(s.albums[index]))index=s.albums.indexOf(v[0]);render()};for(let side of ['original','new'])$(side).onclick=()=>{$('zoomImage').src=$(side).src;$('zoom').showModal()};$('closeZoom').onclick=()=>$('zoom').close();document.addEventListener('keydown',e=>{if(busy||$('zoom').open||e.target.tagName==='SELECT')return;if(e.key==='1')select('original');if(e.key==='2')select('new');if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});fetch('/api/state').then(r=>r.json()).then(d=>{s=d;index=Math.max(0,s.albums.findIndex(a=>a.id===Number(localStorage.getItem('final23-id'))));render()}).catch(e=>$('status').textContent=e.message);
</script></body></html>
